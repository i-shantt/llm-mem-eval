[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "memllm"
version = "0.1.0"
description = "Write-path and read-path cost accounting for LLM memory systems, evaluated without an LLM judge"
readme = "README.md"
license = { file = "LICENSE" }
# 3.10 is the floor: the code uses PEP 604 unions (`bool | None`) at runtime in
# dataclass field types, which 3.9 cannot evaluate.
requires-python = ">=3.10"

dependencies = [
    "huggingface_hub",
    "numpy",
    "rank_bm25",
    "tiktoken",
]

[project.optional-dependencies]
# Dense retrieval. Heavy, and only needed for the `dense` and `hybrid` arms.
dense = ["sentence-transformers", "torch"]
# The amortisation figure.
figures = ["matplotlib"]
dev = ["pytest"]
# Mem0's own SDK, for the write policy in memllm/write/mem0_adapter.py.
# Pinned exactly: v2.0.18 is the v3 ADD-only pipeline, which is a different
# algorithm from the 2025 paper, so an unpinned store cannot be attributed to
# either. fastembed is not optional in practice -- without it mem0 silently
# disables BM25 even on qdrant. Not installed by CI; see RUNNING.md.
mem0 = ["mem0ai==2.0.18", "fastembed>=0.7", "spacy>=3.8"]

[tool.setuptools.packages.find]
include = ["memllm*"]
